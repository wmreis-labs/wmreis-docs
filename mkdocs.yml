site_name: wmreis
site_description: Demandas que atravessam o backend e os fronts.
site_url: https://wmreis-labs.github.io/wmreis-docs/
repo_url: https://github.com/wmreis-labs/wmreis-docs
repo_name: wmreis-labs/wmreis-docs
docs_dir: docs
copyright: Documentação pública da organização wmreis-labs

theme:
  name: material
  language: pt
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Tema escuro
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Tema claro
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.indexes
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - toc.follow

plugins:
  - search:
      lang:
        - pt
        - en

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Início: index.md
  - Mudanças:
      - mudancas/index.md
      - RFCs: mudancas/rfc/index.md
      - ADRs:
          - mudancas/adr/index.md
          - Domínio cashbook: mudancas/adr/2026-09-27-dominio-cashbook.md
          - Livros PF e PJ: mudancas/adr/2026-09-27-livros-pf-pj.md
          - Admin e ingestão: mudancas/adr/2026-09-27-admin-e-ingestao.md
      - PRDs:
          - mudancas/prd/index.md
          - Caixa: mudancas/prd/2026-09-27-caixa-pessoal-profissional.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/wmreis-labs/wmreis-docs
